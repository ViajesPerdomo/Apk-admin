name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Locate project root directory
        run: |
          if [ -f "package.json" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -exec dirname {} | head -n 1)
            if [ -n "$SUBDIR" ]; then
              echo "PROJECT_DIR=$SUBDIR" >> $GITHUB_ENV
            else
              echo "PROJECT_DIR=." >> $GITHUB_ENV
            fi
          fi

      - name: Install Dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm run build

      - name: Add and Sync Capacitor Android
        run: |
          cd ${{ env.PROJECT_DIR }}
          npx cap add android || true
          npx cap sync android

      - name: Grant Execute Permissions for Gradle
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ -d "android" ]; then
            chmod +x android/gradlew
          fi

      - name: Build APK with Gradle
        run: |
          cd ${{ env.PROJECT_DIR }}/android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viajes-perdomo-admin-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
